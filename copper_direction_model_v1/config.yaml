# Copper Direction Model V1 — configuration.
# All paths are relative to the project root (the folder containing this file).

data:
  input_csv: "data/raw/copper.csv"
  date_column: null        # null = auto-detect (Date / date / timestamp)
  price_column: null       # null = auto-detect close/settle
  prefer_settle: true      # if both Close and Settle exist, use Settle

target:
  horizon_days: 1
  direction_threshold: 0.0 # set e.g. 0.001 to ignore tiny moves

features:
  lookback_sequence_days: 30
  rolling_windows: [3, 5, 10, 20, 60]
  include_day_of_week: true
  include_volume_features: true

backtest:
  initial_train_size: 1000
  step_size: 1
  retrain_lstm_every: 250
  max_backtest_days: null  # null = run to end of data
  validation_fraction: 0.15

models:
  run_naive: true
  run_logistic: true
  run_random_forest: true
  run_svc: true
  run_lstm: true

lstm:
  hidden_units: 64
  dropout: 0.20
  dense_units: 16
  batch_size: 32
  max_epochs: 100
  patience: 10
  learning_rate: 0.001

signals:
  long_threshold: 0.58
  short_threshold: 0.42
  allow_short_signal: true

evaluation:
  transaction_cost_bps: 0.0
  annualization_days: 252

# SVC can be very slow with daily retraining on large data. Above this many
# training rows the SVC arm is skipped with a clear log message.
limits:
  svc_max_train_rows: 4000
